name: API CI

on:
  push:
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/pipeline-latest-status-api

    steps:
      - name: Check out repository
        uses: action/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Install dependencies
        uses: uv sync --locked

      - name: Run tests
        run: uv run --locked python -m pytest -v